<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>이현도 · Frontend Engineer</title>
    <meta name="description" content="이현도 · Frontend Engineer 포트폴리오" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <style>
      html, body { margin: 0; height: 100%; }
      #root:empty::before { content: '불러오는 중…'; display: block; padding: 40px 16px; font-family: sans-serif; color: #888; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@mui/material@5.15.20/umd/material-ui.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script>
      'use strict'
      const { createElement: h, Fragment, useEffect, useLayoutEffect, useMemo, useRef, useState, useSyncExternalStore } = React
      const {
        AppBar, Box, Card, CircularProgress, CssBaseline, Dialog, Divider, Drawer, IconButton,
        LinearProgress, List, ListItemButton, ListItemText, ListSubheader, Stack, SvgIcon, ThemeProvider,
        Toolbar, Tooltip, Typography, createTheme, useMediaQuery,
      } = MaterialUI

      // ═════════════════════════ 설정 ═════════════════════════

      /** 챕터가 될 문서. md 가 원본이고 이 목록은 순서 · 챕터 이름 · 강조색만 정한다. */
      const DOCS = [
        { id: 'about', label: '소개', path: 'README.md', accent: '#1976d2' },
        { id: 'teachers-class', label: '티처스 클래스', path: 'projects/company/teachers-class.md', accent: '#3f51b5' },
        { id: 'hrd-net-portal', label: 'HRD-Net', path: 'projects/company/hrd-net-portal.md', accent: '#00897b' },
        { id: 'mathcanvas', label: '매쓰캔버스', path: 'projects/company/mathcanvas.md', accent: '#1e88e5' },
        { id: 'haebom', label: '해봄', path: 'projects/company/haebom.md', accent: '#f57c00' },
        { id: 'personal', label: '개인 프로젝트', path: 'projects/personal/README.md', accent: '#7b1fa2' },
      ]
      const REPO_URL = 'https://github.com/AzuraLight/portfolio'
      const OWNER = '이현도'
      const STAGE = { width: 1920, height: 1080, margin: 0.04 }
      /** 한 장에 담는 최대 개수 — 넘치면 다음 장으로 나눈다 (one idea per slide). */
      const CHUNK = { cards: 6, bullets: 5, rows: 6 }
      const STORAGE_KEY = { mode: 'mode', view: 'view' }
      const KEYS = {
        next: ['ArrowRight', 'ArrowDown', 'PageDown', ' '],
        prev: ['ArrowLeft', 'ArrowUp', 'PageUp'],
        first: ['Home'],
        last: ['End'],
        overview: ['Escape', 'o'],
      }
      const SWIPE_MIN_PX = 50

      /** 화면 방식별 글자 크기 · 여백. 발표 보기는 1920 무대 기준 px, 읽기 보기는 기기 px. */
      const TOKENS = {
        present: {
          pad: '96px 128px', gap: 40, eyebrow: 26, coverTitle: 128, title: 76, lead: 36, body: 32,
          cardTitle: 34, cardText: 26, table: 26, code: 24, chapterNo: 280, columns: 3, radius: 28,
        },
        flow: {
          pad: '28px 20px', gap: 14, eyebrow: 12, coverTitle: 36, title: 26, lead: 17, body: 16,
          cardTitle: 17, cardText: 15, table: 14, code: 12, chapterNo: 72, columns: 1, radius: 18,
        },
      }

      // ═════════════════════════ helper ═════════════════════════

      function readStorage(key) {
        try { return localStorage.getItem(key) } catch { return null }
      }

      function writeStorage(key, value) {
        try { localStorage.setItem(key, value) } catch {}
      }

      function createIcon(pathData) {
        return function Icon(props) { return h(SvgIcon, props, h('path', { d: pathData })) }
      }

      function externalLinkProps(href) {
        return { href, target: '_blank', rel: 'noopener' }
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value))
      }

      function chunk(items, size) {
        const chunks = []
        for (let i = 0; i < items.length; i += size) chunks.push(items.slice(i, i + size))
        return chunks
      }

      function elementChildren(node) {
        return Array.from(node.children)
      }

      function outerHtml(nodes) {
        return nodes.map((node) => node.outerHTML).join('')
      }

      function resolveRelativePath(href, basePath) {
        return new URL(href, new URL(basePath, 'https://x/')).pathname.slice(1)
      }

      function findDocByPath(path) {
        return DOCS.find((d) => d.path === path || d.path === path.replace(/\/$/, '') + '/README.md') ?? null
      }

      function chapterNumber(doc) {
        return String(DOCS.indexOf(doc)).padStart(2, '0')
      }

      function chunkLabel(index, total) {
        return total > 1 ? `${index + 1} / ${total}` : ''
      }

      function isTypingTarget(element) {
        return Boolean(element?.closest?.('input, textarea, [contenteditable="true"]'))
      }

      function matchesKey(event, group) {
        return KEYS[group].includes(event.key)
      }

      // ═════════════════════════ markdown → DOM 정리 ═════════════════════════

      function parseMarkdown(markdown) {
        const container = document.createElement('div')
        container.innerHTML = marked.parse(markdown)
        return container
      }

      /** 문서 사이 상대 링크(…/x.md)는 그 챕터로, 그 밖의 상대 경로는 저장소 링크로 바꾼다. */
      function rewriteLinks(container, basePath) {
        container.querySelectorAll('a[href]').forEach((anchor) => {
          const href = anchor.getAttribute('href')
          if (/^https?:/i.test(href)) return Object.assign(anchor, { target: '_blank', rel: 'noopener' })
          if (/^[a-z]+:/i.test(href) || href.startsWith('#')) return
          const path = resolveRelativePath(href, basePath)
          const doc = findDocByPath(path)
          anchor.setAttribute('href', doc ? '#chapter-' + doc.id : `${REPO_URL}/tree/main/${path}`)
        })
      }

      function removeRules(container) {
        container.querySelectorAll('hr').forEach((rule) => rule.remove())
      }

      /** 제목 태그마다 묶음을 연다. 첫 제목 앞 노드는 `heading: null` 묶음이 된다. */
      function groupByHeading(nodes, tagName) {
        const groups = []
        nodes.forEach((node) => {
          if (node.tagName === tagName) return groups.push({ heading: node, nodes: [] })
          if (groups.length === 0) groups.push({ heading: null, nodes: [] })
          groups[groups.length - 1].nodes.push(node)
        })
        return groups
      }

      // ═════════════════════════ 블록 → 슬라이드 ═════════════════════════
      // 블록: 표 · 목록 · 코드는 그 자체가 한 블록이고, 그 앞 단락은 그 블록의 리드가 된다.

      const BLOCK_TAGS = { TABLE: 'table', UL: 'list', OL: 'list', PRE: 'code' }

      function splitIntoBlocks(nodes) {
        const blocks = []
        let pending = []
        nodes.forEach((node) => {
          const type = BLOCK_TAGS[node.tagName]
          if (!type) return pending.push(node)
          blocks.push({ type, node, lead: pending, caption: [] })
          pending = []
        })
        if (pending.length && blocks.length) blocks[blocks.length - 1].caption.push(...pending)
        else if (pending.length) blocks.push({ type: 'prose', node: null, lead: pending, caption: [] })
        return blocks
      }

      function tableRows(table) {
        return Array.from(table.querySelectorAll('tbody tr'))
      }

      function tableHeaders(table) {
        return Array.from(table.querySelectorAll('thead th')).map((th) => th.innerHTML)
      }

      function rowCells(row) {
        return Array.from(row.children).map((cell) => cell.innerHTML)
      }

      function isKeyValueTable(table) {
        return tableHeaders(table).length === 2
      }

      function startsWithStrong(listItem) {
        const first = listItem.firstChild
        return first?.nodeType === 1 && first.tagName === 'STRONG'
      }

      function isCardList(list) {
        const items = elementChildren(list)
        return items.length > 1 && items.filter(startsWithStrong).length >= items.length * 0.6
      }

      /** `**제목.** 설명` 목록 항목을 카드 { title, html } 로 나눈다. */
      function listItemToCard(listItem) {
        const clone = listItem.cloneNode(true)
        const strong = startsWithStrong(clone) ? clone.firstChild : null
        const title = strong ? strong.textContent.replace(/[.:：]\s*$/, '').trim() : ''
        strong?.remove()
        return { title, html: clone.innerHTML.replace(/^\s*[:：.—-]?\s*/, '') }
      }

      function baseSlide(context, extra) {
        return {
          chapterId: context.doc.id,
          chapterLabel: context.doc.label,
          accent: context.doc.accent,
          eyebrow: context.eyebrow,
          title: context.title,
          ...extra,
        }
      }

      function tableToSlides(block, context) {
        const headers = tableHeaders(block.node)
        const rowChunks = chunk(tableRows(block.node).map(rowCells), CHUNK.rows)
        const layout = isKeyValueTable(block.node) ? 'facts' : 'table'
        return rowChunks.map((rows, i) => baseSlide(context, {
          layout, headers, rows, page: chunkLabel(i, rowChunks.length),
          lead: i === 0 ? outerHtml(block.lead) : '', caption: i === rowChunks.length - 1 ? outerHtml(block.caption) : '',
        }))
      }

      function listToSlides(block, context) {
        const cardMode = isCardList(block.node)
        const items = elementChildren(block.node).map((li) => (cardMode ? listItemToCard(li) : { title: '', html: li.innerHTML }))
        const itemChunks = chunk(items, cardMode ? CHUNK.cards : CHUNK.bullets)
        return itemChunks.map((part, i) => baseSlide(context, {
          layout: cardMode ? 'cards' : 'bullets', items: part, ordered: block.node.tagName === 'OL',
          page: chunkLabel(i, itemChunks.length),
          lead: i === 0 ? outerHtml(block.lead) : '', caption: i === itemChunks.length - 1 ? outerHtml(block.caption) : '',
        }))
      }

      function codeToSlides(block, context) {
        return [baseSlide(context, {
          layout: 'code', code: block.node.textContent, page: '',
          lead: outerHtml(block.lead), caption: outerHtml(block.caption),
        })]
      }

      function proseToSlides(block, context) {
        return [baseSlide(context, { layout: 'prose', html: outerHtml(block.lead), page: '', lead: '', caption: '' })]
      }

      const BLOCK_TO_SLIDES = { table: tableToSlides, list: listToSlides, code: codeToSlides, prose: proseToSlides }

      function blocksToSlides(nodes, context) {
        return splitIntoBlocks(nodes).flatMap((block) => BLOCK_TO_SLIDES[block.type](block, context))
      }

      /** `##` 묶음: 안에 `###` 가 있으면 그 하나하나가 슬라이드 묶음이 된다. */
      function sectionToSlides(section, doc) {
        const sectionTitle = section.heading.textContent.trim()
        return groupByHeading(section.nodes, 'H3').flatMap((sub) => {
          const context = sub.heading
            ? { doc, eyebrow: sectionTitle, title: sub.heading.textContent.trim() }
            : { doc, eyebrow: doc.label, title: sectionTitle }
          return sub.nodes.length ? blocksToSlides(sub.nodes, context) : []
        })
      }

      function firstNodeOf(nodes, tagNames) {
        return nodes.find((node) => tagNames.includes(node.tagName)) ?? null
      }

      /** `#` 묶음 → 표지: 제목 · 리드(첫 단락) · 사실 표 · 링크 목록 · 덧붙임. */
      function coverSlide(group, doc) {
        const leadNode = firstNodeOf(group.nodes, ['P', 'BLOCKQUOTE'])
        const factsNode = firstNodeOf(group.nodes, ['TABLE'])
        const metaNode = firstNodeOf(group.nodes, ['UL'])
        const noteNodes = group.nodes.filter((node) => node.tagName === 'BLOCKQUOTE' && node !== leadNode)
        return {
          layout: 'cover', chapterId: doc.id, chapterLabel: doc.label, accent: doc.accent,
          eyebrow: doc.id === 'about' ? 'Portfolio' : doc.label,
          title: group.heading.textContent.trim(),
          lead: leadNode?.innerHTML ?? '',
          rows: factsNode ? tableRows(factsNode).map(rowCells) : [],
          meta: metaNode ? elementChildren(metaNode).map((li) => li.innerHTML) : [],
          note: outerHtml(noteNodes),
          page: '',
        }
      }

      function chapterSlide(doc) {
        return { layout: 'chapter', chapterId: doc.id, chapterLabel: doc.label, accent: doc.accent, number: chapterNumber(doc), title: doc.label, page: '' }
      }

      function documentToSlides(markdown, doc) {
        const container = parseMarkdown(markdown)
        rewriteLinks(container, doc.path)
        removeRules(container)
        const [head, ...sections] = groupByHeading(elementChildren(container), 'H2')
        const coverGroup = groupByHeading(head.nodes, 'H1').find((g) => g.heading)
        const intro = doc.id === 'about' ? [] : [chapterSlide(doc)]
        const cover = coverGroup ? [coverSlide(coverGroup, doc)] : []
        return [...intro, ...cover, ...sections.flatMap((section) => sectionToSlides(section, doc))]
      }

      // ═════════════════════════ 미니 store (Redux 방식) ═════════════════════════
      // view → dispatch(action) → reducer → state → view. 상태를 바꾸는 길은 reducer 하나뿐이다.

      const ActionType = {
        SlidesLoaded: 'deck/slidesLoaded',
        Navigated: 'deck/navigated',
        Stepped: 'deck/stepped',
        SlideScrolledInto: 'deck/slideScrolledInto',
        OverviewToggled: 'ui/overviewToggled',
        DrawerToggled: 'ui/drawerToggled',
        ModeToggled: 'theme/modeToggled',
        ViewToggled: 'view/toggled',
      }

      const actions = {
        slidesLoaded: (slides) => ({ type: ActionType.SlidesLoaded, payload: slides }),
        navigated: (index) => ({ type: ActionType.Navigated, payload: index }),
        stepped: (delta) => ({ type: ActionType.Stepped, payload: delta }),
        slideScrolledInto: (index) => ({ type: ActionType.SlideScrolledInto, payload: index }),
        overviewToggled: (open) => ({ type: ActionType.OverviewToggled, payload: open }),
        drawerToggled: (open) => ({ type: ActionType.DrawerToggled, payload: open }),
        modeToggled: (current) => ({ type: ActionType.ModeToggled, payload: current }),
        viewToggled: (current) => ({ type: ActionType.ViewToggled, payload: current }),
      }

      function readInitialIndex() {
        const index = Number(location.hash.replace('#/', ''))
        return Number.isInteger(index) && index > 0 ? index : 0
      }

      const initialState = {
        slides: null,
        index: readInitialIndex(),
        overviewOpen: false,
        drawerOpen: false,
        mode: readStorage(STORAGE_KEY.mode),
        view: readStorage(STORAGE_KEY.view),
      }

      function withIndex(state, index) {
        const last = (state.slides?.length ?? 1) - 1
        return { ...state, index: clamp(index, 0, last), overviewOpen: false, drawerOpen: false }
      }

      function reducer(state, action) {
        switch (action.type) {
          case ActionType.SlidesLoaded:
            return withIndex({ ...state, slides: action.payload }, state.index)
          case ActionType.Navigated:
            return withIndex(state, action.payload)
          case ActionType.Stepped:
            return withIndex(state, state.index + action.payload)
          case ActionType.SlideScrolledInto:
            return { ...state, index: action.payload }
          case ActionType.OverviewToggled:
            return { ...state, overviewOpen: action.payload }
          case ActionType.DrawerToggled:
            return { ...state, drawerOpen: action.payload }
          case ActionType.ModeToggled:
            return { ...state, mode: action.payload === 'dark' ? 'light' : 'dark' }
          case ActionType.ViewToggled:
            return { ...state, view: action.payload === 'present' ? 'flow' : 'present' }
          default:
            return state
        }
      }

      function createStore(reduce, preloadedState) {
        let state = preloadedState
        const listeners = new Set()
        return {
          getState: () => state,
          dispatch(action) {
            state = reduce(state, action)
            listeners.forEach((listener) => listener())
          },
          subscribe(listener) {
            listeners.add(listener)
            return () => listeners.delete(listener)
          },
        }
      }

      const store = createStore(reducer, initialState)
      const dispatch = (action) => store.dispatch(action)

      function useSelector(selector) {
        return useSyncExternalStore(store.subscribe, () => selector(store.getState()))
      }

      const selectSlides = (state) => state.slides
      const selectIndex = (state) => state.index
      const selectOverviewOpen = (state) => state.overviewOpen
      const selectDrawerOpen = (state) => state.drawerOpen
      const selectStoredMode = (state) => state.mode
      const selectStoredView = (state) => state.view

      // ═════════════════════════ 부수효과 (결과는 action 으로만 store 에 넣는다) ═════════════════════════

      function fetchMarkdown(path) {
        const failure = `# ${path}\n\n불러오지 못했습니다.`
        return fetch(path).then((res) => (res.ok ? res.text() : failure)).catch(() => failure)
      }

      async function loadSlides() {
        const decks = await Promise.all(DOCS.map(async (doc) => documentToSlides(await fetchMarkdown(doc.path), doc)))
        dispatch(actions.slidesLoaded(decks.flat()))
      }

      function persistPreferences() {
        return store.subscribe(() => {
          const { mode, view } = store.getState()
          if (mode) writeStorage(STORAGE_KEY.mode, mode)
          if (view) writeStorage(STORAGE_KEY.view, view)
        })
      }

      function syncHashWithIndex() {
        return store.subscribe(() => history.replaceState(null, '', '#/' + store.getState().index))
      }

      function firstIndexOfChapter(chapterId) {
        return store.getState().slides?.findIndex((slide) => slide.chapterId === chapterId) ?? -1
      }

      function handlePresentKeydown(event) {
        if (isTypingTarget(event.target) || event.metaKey || event.ctrlKey || event.altKey) return
        const { overviewOpen, slides } = store.getState()
        const action =
          matchesKey(event, 'overview') ? actions.overviewToggled(!overviewOpen)
          : overviewOpen ? null
          : matchesKey(event, 'next') ? actions.stepped(1)
          : matchesKey(event, 'prev') ? actions.stepped(-1)
          : matchesKey(event, 'first') ? actions.navigated(0)
          : matchesKey(event, 'last') ? actions.navigated((slides?.length ?? 1) - 1)
          : null
        if (!action) return
        event.preventDefault()
        dispatch(action)
      }

      function listenPresentKeys() {
        window.addEventListener('keydown', handlePresentKeydown)
        return () => window.removeEventListener('keydown', handlePresentKeydown)
      }

      function listenSwipe(target) {
        let startX = null
        const onStart = (event) => { startX = event.touches[0].clientX }
        const onEnd = (event) => {
          if (startX === null) return
          const dx = event.changedTouches[0].clientX - startX
          startX = null
          if (Math.abs(dx) >= SWIPE_MIN_PX) dispatch(actions.stepped(dx < 0 ? 1 : -1))
        }
        target.addEventListener('touchstart', onStart, { passive: true })
        target.addEventListener('touchend', onEnd)
        return () => { target.removeEventListener('touchstart', onStart); target.removeEventListener('touchend', onEnd) }
      }

      /** 본문 안의 챕터 링크(#chapter-…)를 가로채 그 챕터로 넘긴다. */
      function handleChapterLinkClick(event) {
        const anchor = event.target.closest?.('a[href^="#chapter-"]')
        if (!anchor) return
        event.preventDefault()
        const index = firstIndexOfChapter(anchor.getAttribute('href').slice('#chapter-'.length))
        if (index >= 0) dispatch(actions.navigated(index))
      }

      function listenChapterLinks() {
        document.addEventListener('click', handleChapterLinkClick)
        return () => document.removeEventListener('click', handleChapterLinkClick)
      }

      const FLOW_TRACK_ID = 'flow-track'

      /** 읽기 보기: 가로 트랙에서 화면을 차지한 카드를 현재 위치로 알린다. */
      function observeFlowCards() {
        const observer = new IntersectionObserver(
          (entries) => entries.filter((e) => e.isIntersecting)
            .forEach((e) => dispatch(actions.slideScrolledInto(Number(e.target.dataset.flowIndex)))),
          { root: document.getElementById(FLOW_TRACK_ID), threshold: 0.6 },
        )
        document.querySelectorAll('[data-flow-index]').forEach((el) => observer.observe(el))
        return () => observer.disconnect()
      }

      function scrollFlowCardIntoView(index, behavior = 'auto') {
        document.querySelector(`[data-flow-index="${index}"]`)?.scrollIntoView({ inline: 'start', block: 'nearest', behavior })
      }

      function stepFlowCard(delta) {
        const { index, slides } = store.getState()
        scrollFlowCardIntoView(clamp(index + delta, 0, slides.length - 1), 'smooth')
      }

      // ═════════════════════════ 테마 · 보기 결정 ═════════════════════════

      function useResolvedMode() {
        const stored = useSelector(selectStoredMode)
        const system = useMediaQuery('(prefers-color-scheme: dark)') ? 'dark' : 'light'
        return stored ?? system
      }

      /** reveal.js 처럼 좁거나 세로인 화면은 읽기 보기로 자동 전환한다. 사용자가 고르면 그것을 따른다. */
      function useResolvedView() {
        const stored = useSelector(selectStoredView)
        const compact = useMediaQuery('(max-width: 899px), (max-aspect-ratio: 1/1)')
        return stored ?? (compact ? 'flow' : 'present')
      }

      function buildTheme(mode) {
        return createTheme({
          palette: {
            mode,
            primary: { main: mode === 'dark' ? '#90caf9' : '#1976d2' },
            background: mode === 'dark' ? { default: '#0b0e12', paper: '#151a21' } : { default: '#eef1f5', paper: '#ffffff' },
          },
          typography: { fontFamily: "'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" },
          shape: { borderRadius: 14 },
        })
      }

      function useStageScale() {
        const compute = () => Math.min(innerWidth / STAGE.width, innerHeight / STAGE.height) * (1 - STAGE.margin)
        const [scale, setScale] = useState(compute)
        useEffect(() => {
          const onResize = () => setScale(compute())
          addEventListener('resize', onResize)
          return () => removeEventListener('resize', onResize)
        }, [])
        return scale
      }

      /** 무대보다 큰 본문은 무대 안에 들어오도록 줄인다 (발표 보기 전용). */
      function useFitToBox(enabled) {
        const boxRef = useRef(null)
        const contentRef = useRef(null)
        useLayoutEffect(() => {
          const box = boxRef.current
          const content = contentRef.current
          if (!enabled || !box || !content) return
          content.style.transform = ''
          const ratio = Math.min(1, box.clientHeight / content.scrollHeight)
          content.style.transform = ratio < 1 ? `scale(${ratio})` : ''
        })
        return { boxRef, contentRef }
      }

      // ═════════════════════════ 아이콘 (Material Icons 경로) ═════════════════════════

      const Icons = {

        useEffect(() => { scrollFlowCardIntoView(index, 'smooth') }, [index])
        useEffect(observeFlowCards, [])
        return h(Box, { sx: { height: '100svh', display: 'flex', flexDirection: 'column', bgcolor: 'background.default' } },
          h(FlowHeader, { slide: slides[index], index, total: slides.length, mode }),
          h(Box, {
            id: FLOW_TRACK_ID,
            sx: { flex: 1, minHeight: 0, display: 'flex', overflowX: 'auto', overflowY: 'hidden', scrollSnapType: 'x mandatory', scrollbarWidth: 'none', '&::-webkit-scrollbar': { display: 'none' } },
          }, slides.map((slide, i) => h(FlowCard, { key: i, slide, index: i }))),
          h(FlowPager, { index, total: slides.length }))
      }

      // ═════════════════════════ 공통 ═════════════════════════

      function groupSlidesByChapter(slides) {
        return DOCS.map((doc) => ({
          doc,
          items: slides.map((slide, index) => ({ slide, index }))
            .filter(({ slide }) => slide.chapterId === doc.id && slide.layout !== 'chapter'),
        }))
      }

      function outlineLabel(slide) {
        return slide.layout === 'cover' ? '표지' : [slide.title, slide.page].filter(Boolean).join(' · ')
      }

      function navigateFromOutline(index) {
        dispatch(actions.navigated(index))
      }

      function OutlineDrawer({ open, slides, index }) {
        return h(Drawer, { open, onClose: () => dispatch(actions.drawerToggled(false)) },
          h(Box, { sx: { width: { xs: '84vw', sm: 340 }, maxWidth: 360 }, role: 'navigation' },
            h(Toolbar, null, h(Typography, { variant: 'subtitle1', fontWeight: 700 }, '목차')),
            h(Divider),
            groupSlidesByChapter(slides).map(({ doc, items }) => h(List, {
              key: doc.id, dense: true,
              subheader: h(ListSubheader, { sx: { fontWeight: 700, lineHeight: '40px', color: doc.accent } }, doc.label),
            }, items.map(({ slide, index: i }) => h(ListItemButton, {
              key: i, selected: i === index, onClick: () => navigateFromOutline(i), sx: { pl: 3 },
            }, h(ListItemText, { primary: outlineLabel(slide), primaryTypographyProps: { noWrap: true } })))))))
      }

      function LoadingScreen() {
        return h(Box, { sx: { height: '100svh', display: 'grid', placeItems: 'center' } }, h(CircularProgress))
      }

      // ═════════════════════════ 앱 (store 를 읽어 아래로만 내려준다) ═════════════════════════

      function useAppEffects() {
        useEffect(() => { loadSlides() }, [])
        useEffect(persistPreferences, [])
        useEffect(syncHashWithIndex, [])
        useEffect(listenChapterLinks, [])
      }

      function Deck({ slides, index, mode, view }) {
        return view === 'present'
          ? h(PresentView, { slides, index, mode })
          : h(FlowView, { slides, index, mode })
      }

      function App() {
        const slides = useSelector(selectSlides)
        const index = useSelector(selectIndex)
        const overviewOpen = useSelector(selectOverviewOpen)
        const drawerOpen = useSelector(selectDrawerOpen)
        const mode = useResolvedMode()
        const view = useResolvedView()
        const theme = useMemo(() => buildTheme(mode), [mode])
        useAppEffects()

        return h(ThemeProvider, { theme },
          h(CssBaseline),
          slides
            ? h(Fragment, null,
                h(Deck, { slides, index, mode, view }),
                h(OutlineDrawer, { open: drawerOpen, slides, index }),
                view === 'present' && h(Overview, { open: overviewOpen, slides, index }))
            : h(LoadingScreen))
      }

      ReactDOM.createRoot(document.getElementById('root')).render(h(App))
    </script>
  </body>
</html>
